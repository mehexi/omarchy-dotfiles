[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
font=Iosevka Nerd Font Mono:size=10
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
multiplier=7.0
lines=10000

[cursor]
style=block
blink=no

[key-bindings]
# Super+C/V (Omarchy universal clipboard) inject Ctrl+Shift+C/V into terminals as of
# omarchy 4.5.0; the Super+ variants cover Hyprland leaving the held Super in the chord.
clipboard-copy=Control+Insert Control+Shift+c Super+Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v Super+Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
